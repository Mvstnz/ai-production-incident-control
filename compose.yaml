name: apic-portfolio
services:
  postgres:
    image: postgres:17.6
    environment:
      POSTGRES_USER: apic_owner
      POSTGRES_PASSWORD: ${DB_OWNER_PASSWORD:?run bootstrap secrets first}
      POSTGRES_DB: apic_demo
      APIC_APP_PASSWORD: ${DB_APP_PASSWORD}
      APIC_ERP_PASSWORD: ${DB_ERP_PASSWORD}
      APIC_N8N_PASSWORD: ${DB_N8N_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/postgres-init.sh:/docker-entrypoint-initdb.d/10-apic.sh:ro
    healthcheck:
      test: [CMD-SHELL, pg_isready -U apic_owner -d apic_demo]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  ops-api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: [uvicorn, backend.main:app, --host, 0.0.0.0, --port, '8000']
    environment:
      DATABASE_URL: postgresql://apic_app:${DB_APP_PASSWORD}@postgres:5432/apic_demo
      SERVICE_TOKEN: ${SERVICE_TOKEN}
      ERP_READ_TOKEN: ${ERP_READ_TOKEN}
      ERP_WRITE_TOKEN: ${ERP_WRITE_TOKEN}
      SESSION_SECRET: ${SESSION_SECRET}
      N8N_WEBHOOK_TOKEN: ${N8N_WEBHOOK_TOKEN}
      PROFILE: DEMO_LOCAL
      AI_MODE: ${AI_MODE:-fixture}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_MAX_CALLS: ${LLM_MAX_CALLS:-0}
      EXTERNAL_ACTIONS_ENABLED: 'false'
      ERP_BASE_URL: http://mock-erp:8001
      N8N_BASE_URL: http://n8n:5678
      N8N_INTAKE_EMAIL_URL: http://n8n:5678/webhook/apic-email
      N8N_INTAKE_API_URL: http://n8n:5678/webhook/apic-intake
      N8N_ALLOWED_RESUME_ORIGIN: http://n8n:5678
      DASHBOARD_ORIGIN: http://127.0.0.1:5173
      MAILPIT_HOST: mailpit
      SMTP_PORT: '1025'
    ports: ['127.0.0.1:8000:8000']
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  mock-erp:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: [uvicorn, backend.erp:app, --host, 0.0.0.0, --port, '8001']
    environment:
      DATABASE_URL: postgresql://apic_erp:${DB_ERP_PASSWORD}@postgres:5432/apic_demo
      ERP_DATABASE_URL: postgresql://apic_erp:${DB_ERP_PASSWORD}@postgres:5432/apic_demo
      ERP_READ_TOKEN: ${ERP_READ_TOKEN}
      ERP_WRITE_TOKEN: ${ERP_WRITE_TOKEN}
      PROFILE: DEMO_LOCAL
      EXTERNAL_ACTIONS_ENABLED: 'false'
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health/ready')"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  n8n:
    image: n8nio/n8n:2.37.10
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: apic_n8n
      DB_POSTGRESDB_USER: apic_n8n
      DB_POSTGRESDB_PASSWORD: ${DB_N8N_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_HOST: 127.0.0.1
      N8N_PORT: '5678'
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://n8n:5678/
      N8N_EDITOR_BASE_URL: http://127.0.0.1:5678
      N8N_SECURE_COOKIE: 'false'
      GENERIC_TIMEZONE: Europe/Berlin
      TZ: Europe/Berlin
      N8N_RUNNERS_ENABLED: 'true'
      N8N_RUNNERS_MODE: external
      N8N_RUNNERS_BROKER_LISTEN_ADDRESS: 0.0.0.0
      N8N_RUNNERS_AUTH_TOKEN: ${RUNNER_TOKEN}
      N8N_DIAGNOSTICS_ENABLED: 'false'
      N8N_VERSION_NOTIFICATIONS_ENABLED: 'false'
      EXECUTIONS_DATA_PRUNE: 'true'
      EXECUTIONS_DATA_MAX_AGE: '168'
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: all
      EXECUTIONS_DATA_SAVE_ON_ERROR: all
    ports: ['127.0.0.1:5678:5678']
    volumes:
      - n8n-data:/home/node/.n8n
      - ./n8n:/project/n8n:ro
      - ./.local:/project/local
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, --spider, -q, http://127.0.0.1:5678/healthz]
      interval: 5s
      timeout: 3s
      retries: 40
    restart: unless-stopped
  n8n-runners:
    image: n8nio/runners:2.37.10
    environment:
      N8N_RUNNERS_TASK_BROKER_URI: http://n8n:5679
      N8N_RUNNERS_AUTH_TOKEN: ${RUNNER_TOKEN}
    depends_on: [n8n]
    restart: unless-stopped
  mailpit:
    image: axllent/mailpit:v1.27.4
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: '1000'
    ports: ['127.0.0.1:8025:8025']
    volumes: ['mail-data:/data']
    restart: unless-stopped
  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    ports: ['127.0.0.1:5173:80']
    depends_on: [ops-api]
    restart: unless-stopped
  bootstrap:
    profiles: [setup]
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: [python, -m, backend.bootstrap]
    environment:
      DATABASE_URL: postgresql://apic_owner:${DB_OWNER_PASSWORD}@postgres:5432/apic_demo
      MIGRATION_DATABASE_URL: postgresql://apic_owner:${DB_OWNER_PASSWORD}@postgres:5432/apic_demo
      SESSION_SECRET: ${SESSION_SECRET}
    volumes: ['./.local/credentials.json:/app/.local/credentials.json:ro']
    depends_on:
      postgres: {condition: service_healthy}
volumes:
  postgres-data:
  n8n-data:
  mail-data:
